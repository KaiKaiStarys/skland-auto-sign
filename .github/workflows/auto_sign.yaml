name: Auto Sign

on:
  schedule:
    # UTC 20:13 / 21:13 / 22:13 / 23:13
    # = 北京时间 04:13 / 05:13 / 06:13 / 07:13
    - cron: '13 20,21,22,23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install cryptography

      - name: Run main.py
        env:
          Github_Actions: true
          TOKEN: ${{ secrets.TOKEN }}
          SC3_SENDKEY: ${{ secrets.SC3_SENDKEY }}
          SC3_UID: ${{ secrets.SC3_UID }}
          EXIT_WHEN_FAIL: ${{ vars.EXIT_WHEN_FAIL }}
        run: python src/main.py
